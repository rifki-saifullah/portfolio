services:
  caddy:
    image: caddy:2.8-alpine
    container_name: portfolio_caddy_prod
    restart: always
    command:
      - "caddy"
      - "run"
      - "--config"
      - "/etc/caddy/Caddyfile"
      - "--adapter"
      - "caddyfile"
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./.env.production
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    networks:
      - portfolio_prod_net

  mysql_prod:
    image: mysql:8.0
    container_name: portfolio_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '--password=${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_prod_net

  redis_prod:
    image: redis:7-alpine
    container_name: portfolio_redis_prod
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_prod_net

  server_prod:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: portfolio_server_prod
    restart: always
    env_file:
      - ./.env.production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql_prod:
        condition: service_healthy
      redis_prod:
        condition: service_healthy
    networks:
      - portfolio_prod_net

  client_prod:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: portfolio_client_prod
    restart: always
    env_file:
      - ./.env.production
    depends_on:
      - server_prod
    networks:
      - portfolio_prod_net

volumes:
  mysql_prod_data:
  redis_prod_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  portfolio_prod_net:
    driver: bridge
